name: CI

on:
  push:
    branches: [master, dev, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [master, dev, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: PHP ${{ matrix.php }} / SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@add91f08e1598a0b6ff470f1e389f9d652559bf0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test
      - run: composer probe:sqlite > sqlite-probe.json
      - run: composer probe:execution -- sqlite > sqlite-execution-probe.json
      - run: composer probe:transaction -- sqlite > sqlite-transaction-probe.json
      - name: Report linked SQLite runtime
        run: php -r 'echo (new PDO("sqlite::memory:"))->query("SELECT sqlite_version()")->fetchColumn(), PHP_EOL;'

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@add91f08e1598a0b6ff470f1e389f9d652559bf0
        with:
          php-version: "8.5"
          extensions: pdo, pdo_sqlite, pcov
          coverage: pcov
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit
      - run: composer check
      - run: composer test:coverage
      - run: composer coverage:check

  branch-coverage:
    name: Xdebug branch and path coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@add91f08e1598a0b6ff470f1e389f9d652559bf0
        with:
          php-version: "8.5"
          extensions: pdo, pdo_sqlite, xdebug-3.5.3
          coverage: xdebug
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer test:coverage:branch
      - run: composer coverage:check:branch
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: xdebug-branch-coverage
          path: coverage/xdebug-clover.xml
          if-no-files-found: error
          retention-days: 30

  direct-probes:
    name: Direct probes / ${{ matrix.fixture.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - name: minimum
            mariadb: 11.8.2
            mysql: 8.0.11
          - name: current
            mariadb: 11.8.8
            mysql: 8.0.46
    env:
      MARIADB_VERSION: ${{ matrix.fixture.mariadb }}
      MYSQL_VERSION: ${{ matrix.fixture.mysql }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@add91f08e1598a0b6ff470f1e389f9d652559bf0
        with:
          php-version: "8.2"
          extensions: pdo, pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Start exact direct-engine fixtures
        run: docker compose -f tools/database-probes/compose.yaml up --detach --wait --wait-timeout 180 mariadb mysql
      - name: Run prepare and buffering matrix
        shell: bash
        run: |
          mkdir -p tools/database-probes/results
          php tools/database-probes/wait.php mariadb
          php tools/database-probes/wait.php mysql
          for target in mariadb mysql; do
            for emulated in false true; do
              for buffered in false true; do
                PROBE_EMULATE_PREPARES="${emulated}" PROBE_BUFFERED="${buffered}" \
                  php tools/database-probes/run.php "${target}" \
                  --output="tools/database-probes/results/${target}-${emulated}-${buffered}.json"
              done
            done
          done
          php tools/database-probes/execution-smoke.php mariadb \
            --output=tools/database-probes/results/mariadb-execution-native-buffered.json
          php tools/database-probes/execution-smoke.php mysql \
            --output=tools/database-probes/results/mysql-execution-native-buffered.json
          php tools/database-probes/transaction-smoke.php mariadb \
            --output=tools/database-probes/results/mariadb-transaction-native-buffered.json
          php tools/database-probes/transaction-smoke.php mysql \
            --output=tools/database-probes/results/mysql-transaction-native-buffered.json
          php tools/database-probes/summarize.php tools/database-probes/results
      - name: Stop direct-engine fixtures
        if: always()
        run: docker compose -f tools/database-probes/compose.yaml down --volumes --remove-orphans
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: direct-pdo-probe-reports-${{ matrix.fixture.name }}
          path: tools/database-probes/results/*.json
          if-no-files-found: error
          retention-days: 30

  lowest-dependencies:
    name: Lowest dependencies / PHP 8.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@add91f08e1598a0b6ff470f1e389f9d652559bf0
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite
          coverage: none
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress
      - run: composer test

  sqlite-minimum:
    name: Actual SQLite 3.39.2 runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@add91f08e1598a0b6ff470f1e389f9d652559bf0
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: bash tools/database-probes/run-minimum-sqlite.sh

  no-dev-consumer:
    name: Artifact-installed no-dev consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: shivammathur/setup-php@add91f08e1598a0b6ff470f1e389f9d652559bf0
        with:
          php-version: "8.2"
          extensions: pdo, pdo_sqlite, zip
          coverage: none
      - run: php scripts/check-package.php

  benchmark-control:
    name: Reproducible SQLite benchmark suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@add91f08e1598a0b6ff470f1e389f9d652559bf0
        with:
          php-version: "8.5"
          extensions: pdo, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: mkdir -p benchmarks/results
      - run: composer benchmark > benchmarks/results/sqlite-suite.json
      - name: Compare release baseline and candidate workloads
        shell: bash
        run: |
          baseline_dir="${RUNNER_TEMP}/php-simplequery-release-baseline"
          git worktree add --detach "${baseline_dir}" v0.6.0
          trap 'git worktree remove --force "${baseline_dir}"' EXIT
          composer install --working-dir="${baseline_dir}" --no-interaction --prefer-dist --no-progress
          php benchmarks/noise.php \
            --suite=ci \
            --profile=ci \
            --iterations=9 \
            --warmups=3 \
            --runs=5 \
            --autoload="${GITHUB_WORKSPACE}/vendor/autoload.php" \
            > benchmarks/results/identical-source-noise-control.json
          baseline_order_status=0
          candidate_order_status=0
          php benchmarks/compare.php \
            --suite=ci \
            --profile=ci \
            --iterations=9 \
            --warmups=3 \
            --source-order=baseline-first \
            --noise-report=benchmarks/results/identical-source-noise-control.json \
            --allow-review \
            --baseline-autoload="${baseline_dir}/vendor/autoload.php" \
            --candidate-autoload="${GITHUB_WORKSPACE}/vendor/autoload.php" \
            --baseline-label=release-baseline \
            --candidate-label=candidate \
            > benchmarks/results/release-comparison-baseline-first.json \
            || baseline_order_status=$?
          php benchmarks/compare.php \
            --suite=ci \
            --profile=ci \
            --iterations=9 \
            --warmups=3 \
            --source-order=candidate-first \
            --noise-report=benchmarks/results/identical-source-noise-control.json \
            --allow-review \
            --baseline-autoload="${baseline_dir}/vendor/autoload.php" \
            --candidate-autoload="${GITHUB_WORKSPACE}/vendor/autoload.php" \
            --baseline-label=release-baseline \
            --candidate-label=candidate \
            > benchmarks/results/release-comparison-candidate-first.json \
            || candidate_order_status=$?
          if [ "${baseline_order_status}" -ne 0 ] || [ "${candidate_order_status}" -ne 0 ]; then
            exit 1
          fi
          php -r '$blocking = static function (string $path): array { $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR); $result = []; foreach (($data["performance_review"]["measurements"] ?? []) as $scenario => $operations) { foreach ($operations as $operation => $measurement) { if (($measurement["review_required"] ?? false) === true) { $result[] = $scenario . "/" . $operation; } } } return $result; }; $baseline = $blocking("benchmarks/results/release-comparison-baseline-first.json"); $candidate = $blocking("benchmarks/results/release-comparison-candidate-first.json"); $repeatable = array_values(array_intersect($baseline, $candidate)); if ($repeatable !== []) { fwrite(STDERR, "Repeatable benchmark regressions: " . implode(", ", $repeatable) . PHP_EOL); exit(1); } if ($baseline !== [] || $candidate !== []) { fwrite(STDOUT, "Non-repeatable source-order benchmark signals retained in the comparison artifacts." . PHP_EOL); }'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reproducible-benchmark-reports
          path: benchmarks/results/*.json
          if-no-files-found: error
          retention-days: 30
